# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Variables/#group
# Hyprland 0.56 removed the "-1 = inherit from col.border_active" sentinel, so
# locked groups must name a real gradient. Set here rather than in base/ because
# this file is sourced after theme/, where $activeBorderColor gets its real value.
group {
    col.border_locked_active = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor
}
